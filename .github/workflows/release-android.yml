name: Release APK

# Spustí se na tagu v1.2.3, případně ručně přes Actions → Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez v, např. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar je binárka v repozitáři, tohle ověří, že je to opravdu Gradle
      - uses: gradle/actions/wrapper-validation@v4

      - name: Určit verzi
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # versionCode musí s každým vydáním růst: 1.2.3 → 10203
          echo "code=$(echo "$V" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - name: Poskládat www a nasypat do androidu
        run: npm run sync

      # Kontext secrets se ve step `if` použít nedá, proto se rozhodujeme až v shellu.
      - name: Rozbalit podpisový klíč
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Bez tajemství ANDROID_KEYSTORE_* vznikne nepodepsané APK, do Zapstore ho nedáš."
          fi

      - name: Sestavit APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Pojmenovat APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          DST="stm-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          sha256sum "$DST" | tee "$DST.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Vydat na GitHubu
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          generate_release_notes: true
